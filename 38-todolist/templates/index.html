<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #fdf4bf;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { text-align: center; color: #333; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: #eee;
            margin-bottom: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }
        .btn-eliminar {
            color: #dc3545;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mis Tareas</h2>

        <!-- Formulario para agregar tarea -->
        <form action="/agregar" method="POST">
            <input type="text" name="tarea" placeholder="Nueva tarea..." required>
            <button type="submit">Añadir</button>
        </form>

        <!-- Lista de tareas cargada desde Flask -->
        <ul>
            {% for tarea in tareas %}
                <li>
                    <span>{{ tarea }}</span>
                    <a href="/eliminar/{{ loop.index0 }}" 
                       class="btn-eliminar" 
                       onclick="return confirmarEliminacion('{{ tarea }}')">✕</a>
                </li>
            {% endfor %}
        </ul>
    </div>

    <!-- JavaScript para interactividad sencilla -->
    <script>
        function confirmarEliminacion(nombreTarea) {
            return confirm('¿Estás seguro de que quieres eliminar "' + nombreTarea + '"?');
        }
    </script>

</body>
</html>
