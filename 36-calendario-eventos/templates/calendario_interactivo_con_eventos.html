<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Interactivo y Gestor de Eventos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased">

    <!-- Header principal -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-10 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-md">
                <i data-lucide="calendar" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 leading-none">Mi Calendario</h1>
                <p class="text-xs text-slate-500 mt-1">Gestor de eventos e itinerario</p>
            </div>
        </div>

        <!-- Navegación del mes -->
        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-xl">
            <button id="prev-month-btn" class="p-2 hover:bg-white rounded-lg text-slate-600 hover:text-slate-900 transition-all shadow-sm">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button id="today-btn" class="px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-white rounded-lg transition-all shadow-sm">
                Hoy
            </button>
            <button id="next-month-btn" class="p-2 hover:bg-white rounded-lg text-slate-600 hover:text-slate-900 transition-all shadow-sm">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
            <span id="current-month-display" class="px-3 font-semibold text-slate-800 min-w-[140px] text-center"></span>
        </div>

        <!-- Acciones principales -->
        <div class="flex items-center space-x-3">
            <button id="add-event-btn" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all shadow-md hover:shadow-lg active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Nuevo Evento</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Vista de Grilla del Calendario -->
        <main class="flex-1 flex flex-col p-4 md:p-6 overflow-y-auto custom-scrollbar">
            <!-- Encabezados de días de la semana -->
            <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
                <div>Dom</div>
            </div>

            <!-- Grilla dinámica del calendario -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr"></div>
        </main>

        <!-- Panel Lateral de Lista de Eventos Próximos -->
        <aside class="w-full md:w-80 lg:w-96 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shadow-sm">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i data-lucide="list-todo" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="font-bold text-slate-800">Próximos Eventos</h2>
                </div>
                <span id="event-count-badge" class="bg-indigo-50 text-indigo-600 text-xs font-semibold px-2.5 py-1 rounded-full">0 eventos</span>
            </div>

            <!-- Lista con Scroll -->
            <div id="event-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <!-- Se poblará dinámicamente -->
            </div>
        </aside>
    </div>

    <!-- Modal Formulario (Crear / Editar Evento) -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-transform duration-200 scale-95" id="modal-container">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-lg">Nuevo Evento</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200/50 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="event-form" class="p-6 space-y-4">
                <input type="hidden" id="event-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" for="event-title">Título del Evento *</label>
                    <input type="text" id="event-title" required placeholder="Ej. Reunión de Equipo" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" for="event-date">Fecha *</label>
                        <input type="date" id="event-date" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" for="event-time">Hora</label>
                        <input type="time" id="event-time" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Color de Categoría</label>
                    <div class="flex items-center space-x-3 mt-1">
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="indigo" checked class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-indigo-500 block peer-checked:ring-4 peer-checked:ring-indigo-200 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="emerald" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-emerald-500 block peer-checked:ring-4 peer-checked:ring-emerald-200 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="amber" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-amber-500 block peer-checked:ring-4 peer-checked:ring-amber-200 transition-all"></span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="event-color" value="rose" class="peer sr-only">
                            <span class="w-8 h-8 rounded-full bg-rose-500 block peer-checked:ring-4 peer-checked:ring-rose-200 transition-all"></span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1" for="event-desc">Descripción</label>
                    <textarea id="event-desc" rows="3" placeholder="Detalles opcionales..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition-all resize-none"></textarea>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button type="button" id="delete-event-btn" class="hidden items-center space-x-1 text-red-600 hover:text-red-700 font-medium text-sm px-3 py-2 rounded-xl hover:bg-red-50 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span>Eliminar</span>
                    </button>
                    <div class="flex space-x-2 ml-auto">
                        <button type="button" id="cancel-modal-btn" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 text-sm font-medium hover:bg-slate-50 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition-all shadow-md">
                            Guardar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400" id="toast-icon"></i>
        <span id="toast-msg" class="text-sm font-medium">Operación realizada con éxito</span>
    </div>

    <!-- Lógica JavaScript del Frontend y Base de Datos Local -->
    <script>
        // --- BASE DE DATOS LOCAL (LOCALSTORAGE) ---
        class EventDatabase {
            constructor() {
                this.STORAGE_KEY = 'calendar_events_db';
            }

            // Obtener todos los eventos
            getAllEvents() {
                const data = localStorage.getItem(this.STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            }

            // Guardar un evento (Crear o Editar)
            saveEvent(eventData) {
                const events = this.getAllEvents();
                if (eventData.id) {
                    // Editar
                    const index = events.findIndex(e => e.id === eventData.id);
                    if (index !== -1) {
                        events[index] = { ...events[index], ...eventData };
                    }
                } else {
                    // Crear
                    eventData.id = 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                    events.push(eventData);
                }
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(events));
                return eventData;
            }

            // Eliminar evento
            deleteEvent(id) {
                let events = this.getAllEvents();
                events = events.filter(e => e.id !== id);
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(events));
            }
        }

        // --- ESTADO Y CONTROLADOR DE LA APLICACIÓN ---
        const db = new EventDatabase();
        let currentDate = new Date();
        let selectedDate = new Date();

        // Elementos DOM
        const calendarGrid = document.getElementById('calendar-grid');
        const currentMonthDisplay = document.getElementById('current-month-display');
        const eventList = document.getElementById('event-list');
        const eventCountBadge = document.getElementById('event-count-badge');
        const eventModal = document.getElementById('event-modal');
        const modalContainer = document.getElementById('modal-container');
        const eventForm = document.getElementById('event-form');
        const deleteEventBtn = document.getElementById('delete-event-btn');

        // Mapeo de colores Tailwind
        const colorClasses = {
            indigo: { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-500', dot: 'bg-indigo-500' },
            emerald: { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-500', dot: 'bg-emerald-500' },
            amber: { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-500', dot: 'bg-amber-500' },
            rose: { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-500', dot: 'bg-rose-500' }
        };

        // Nombres en Español
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderCalendar();
            setupEventListeners();
        });

        // Configurar Event Listeners
        function setupEventListeners() {
            document.getElementById('prev-month-btn').addEventListener('click', () => changeMonth(-1));
            document.getElementById('next-month-btn').addEventListener('click', () => changeMonth(1));
            document.getElementById('today-btn').addEventListener('click', () => {
                currentDate = new Date();
                renderCalendar();
            });

            document.getElementById('add-event-btn').addEventListener('click', () => openModal());
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);

            eventForm.addEventListener('submit', handleFormSubmit);
            deleteEventBtn.addEventListener('click', handleDeleteEvent);
        }

        // Cambiar mes activo
        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        // Formatear Fecha (YYYY-MM-DD)
        function formatDateKey(year, month, day) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(day).padStart(2, '0');
            return `${year}-${m}-${d}`;
        }

        // Renderizar el Calendario Principal
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Texto cabecera mes
            currentMonthDisplay.textContent = `${monthNames[month]} ${year}`;

            calendarGrid.innerHTML = '';

            // Primer día del mes y total de días
            const firstDayIndex = new Date(year, month, 1).getDay(); // 0 = Domingo
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Ajuste para comenzar en Lunes (0 -> Lunes ... 6 -> Domingo)
            const adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const events = db.getAllEvents();

            // Días del mes anterior (relleno)
            for (let i = adjustedFirstDay; i > 0; i--) {
                const dayNum = daysInPrevMonth - i + 1;
                const cell = createDayCell(dayNum, true);
                calendarGrid.appendChild(cell);
            }

            // Días del mes actual
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = formatDateKey(year, month, day);
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const dayEvents = events.filter(e => e.date === dateKey);

                const cell = createDayCell(day, false, isToday, dateKey, dayEvents);
                calendarGrid.appendChild(cell);
            }

            // Días del mes siguiente (relleno)
            const totalCells = adjustedFirstDay + daysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remainingCells; i++) {
                const cell = createDayCell(i, true);
                calendarGrid.appendChild(cell);
            }

            renderEventSidebar();
        }

        // Crear una celda individual de día
        function createDayCell(dayNumber, isDisabled, isToday = false, dateKey = null, events = []) {
            const cell = document.createElement('div');
            cell.className = `min-h-[100px] border border-slate-100 rounded-xl p-2 flex flex-col justify-between transition-all ${
                isDisabled ? 'bg-slate-50/50 text-slate-300' : 'bg-white hover:border-indigo-200 cursor-pointer shadow-xs'
            } ${isToday ? 'ring-2 ring-indigo-600 ring-offset-2' : ''}`;

            if (!isDisabled && dateKey) {
                cell.addEventListener('click', (e) => {
                    // Evitar abrir modal si se hace clic directamente en un evento existente
                    if (!e.target.closest('.event-item')) {
                        openModal({ date: dateKey });
                    }
                });
            }

            // Contenedor número de día
            const topRow = document.createElement('div');
            topRow.className = 'flex justify-between items-center mb-1';
            
            const numSpan = document.createElement('span');
            numSpan.className = `text-sm font-semibold rounded-full w-7 h-7 flex items-center justify-center ${
                isToday ? 'bg-indigo-600 text-white' : isDisabled ? 'text-slate-300' : 'text-slate-700'
            }`;
            numSpan.textContent = dayNumber;
            topRow.appendChild(numSpan);

            cell.appendChild(topRow);

            // Lista reducida de eventos dentro de la celda
            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'space-y-1 overflow-hidden flex-1';

            events.slice(0, 3).forEach(evt => {
                const colorScheme = colorClasses[evt.color] || colorClasses.indigo;
                const evtBadge = document.createElement('div');
                evtBadge.className = `event-item text-xs p-1 px-1.5 rounded-lg font-medium truncate ${colorScheme.bg} ${colorScheme.text} border-l-2 ${colorScheme.border} flex items-center justify-between`;
                evtBadge.innerHTML = `
                    <span class="truncate">${evt.time ? evt.time + ' ' : ''}${evt.title}</span>
                `;
                evtBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(evt);
                });
                eventsContainer.appendChild(evtBadge);
            });

            if (events.length > 3) {
                const moreBadge = document.createElement('div');
                moreBadge.className = 'text-[10px] text-slate-400 font-medium pl-1';
                moreBadge.textContent = `+${events.length - 3} más`;
                eventsContainer.appendChild(moreBadge);
            }

            cell.appendChild(eventsContainer);
            return cell;
        }

        // Renderizar la barra lateral con los próximos eventos
        function renderEventSidebar() {
            const events = db.getAllEvents();
            // Ordenar por fecha y hora
            events.sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`) - new Date(`${b.date}T${b.time || '00:00'}`));

            eventList.innerHTML = '';
            eventCountBadge.textContent = `${events.length} evento${events.length !== 1 ? 's' : ''}`;

            if (events.length === 0) {
                eventList.innerHTML = `
                    <div class="text-center py-10 text-slate-400 flex flex-col items-center">
                        <i data-lucide="calendar-x" class="w-10 h-10 mb-2 stroke-1"></i>
                        <p class="text-sm">No hay eventos guardados</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            events.forEach(evt => {
                const colorScheme = colorClasses[evt.color] || colorClasses.indigo;
                const card = document.createElement('div');
                card.className = 'p-3 bg-slate-50 border border-slate-200/80 rounded-xl hover:shadow-md transition-all cursor-pointer flex items-start justify-between group';
                
                // Formatear la fecha
                const [y, m, d] = evt.date.split('-');
                const formattedDate = `${d} ${monthNames[parseInt(m)-1].substring(0, 3)} ${y}`;

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center space-x-2">
                            <span class="w-2.5 h-2.5 rounded-full ${colorScheme.dot}"></span>
                            <h4 class="font-bold text-slate-800 text-sm group-hover:text-indigo-600 transition-colors">${evt.title}</h4>
                        </div>
                        <div class="flex items-center space-x-3 text-xs text-slate-500">
                            <span class="flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i>${formattedDate}</span>
                            ${evt.time ? `<span class="flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i>${evt.time}</span>` : ''}
                        </div>
                        ${evt.desc ? `<p class="text-xs text-slate-600 line-clamp-2 mt-1">${evt.desc}</p>` : ''}
                    </div>
                `;

                card.addEventListener('click', () => openModal(evt));
                eventList.appendChild(card);
            });

            lucide.createIcons();
        }

        // Modales
        function openModal(evtData = null) {
            eventForm.reset();
            deleteEventBtn.classList.add('hidden');
            deleteEventBtn.classList.remove('flex');

            if (evtData && evtData.id) {
                // Modo Edición
                document.getElementById('modal-title').textContent = 'Editar Evento';
                document.getElementById('event-id').value = evtData.id;
                document.getElementById('event-title').value = evtData.title;
                document.getElementById('event-date').value = evtData.date;
                document.getElementById('event-time').value = evtData.time || '';
                document.getElementById('event-desc').value = evtData.desc || '';
                
                const colorRadio = eventForm.querySelector(`input[name="event-color"][value="${evtData.color}"]`);
                if (colorRadio) colorRadio.checked = true;

                deleteEventBtn.classList.remove('hidden');
                deleteEventBtn.classList.add('flex');
            } else {
                // Modo Creación
                document.getElementById('modal-title').textContent = 'Nuevo Evento';
                document.getElementById('event-id').value = '';
                // Asignar fecha seleccionada o fecha de hoy por defecto
                const defaultDate = evtData && evtData.date ? evtData.date : new Date().toISOString().split('T')[0];
                document.getElementById('event-date').value = defaultDate;
            }

            eventModal.classList.remove('hidden');
            setTimeout(() => {
                eventModal.classList.remove('opacity-0');
                modalContainer.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            eventModal.classList.add('opacity-0');
            modalContainer.classList.add('scale-95');
            setTimeout(() => {
                eventModal.classList.add('hidden');
            }, 200);
        }

        // Manejar submit del formulario
        function handleFormSubmit(e) {
            e.preventDefault();

            const formData = {
                id: document.getElementById('event-id').value || null,
                title: document.getElementById('event-title').value.trim(),
                date: document.getElementById('event-date').value,
                time: document.getElementById('event-time').value,
                color: eventForm.querySelector('input[name="event-color"]:checked').value,
                desc: document.getElementById('event-desc').value.trim()
            };

            db.saveEvent(formData);
            closeModal();
            renderCalendar();
            showToast(formData.id ? 'Evento actualizado correctamente' : 'Evento guardado con éxito');
        }

        // Eliminar un evento
        function handleDeleteEvent() {
            const id = document.getElementById('event-id').value;
            if (id) {
                db.deleteEvent(id);
                closeModal();
                renderCalendar();
                showToast('Evento eliminado', 'rose');
            }
        }

        // Mostrar Notificación Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.textContent = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
