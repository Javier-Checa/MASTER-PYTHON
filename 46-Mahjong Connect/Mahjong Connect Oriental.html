<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Connect Oriental - Shisen-Sho</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        oriental: ['Noto Serif SC', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        jade: {
                            400: '#34d399',
                            600: '#059669',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        amberGold: '#f59e0b',
                    }
                }
            }
        }
    </script>

        <style>
        body {
            background: radial-gradient(circle at center, #2c1d11 0%, #170e08 100%);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Textura madera / bambú sutíl */
        .wood-pattern {
            background-color: #23160d;
            background-image: radial-gradient(rgba(217, 119, 6, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Estilo 3D de las fichas de Mahjong */
        .mahjong-tile {
            background: linear-gradient(145deg, #ffffff 0%, #f4ede2 60%, #e5d5c0 100%);
            box-shadow: 
                0 4px 0 #bca88e,
                0 7px 0 #9e876b,
                0 9px 12px rgba(0, 0, 0, 0.5);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform-style: preserve-3d;
        }

        .mahjong-tile:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 8px 0 #bca88e,
                0 11px 0 #9e876b,
                0 14px 18px rgba(0, 0, 0, 0.6);
        }

        .mahjong-tile:active, .mahjong-tile.selected {
            transform: translateY(3px) scale(1.02);
            box-shadow: 
                0 2px 0 #bca88e,
                0 4px 0 #9e876b,
                0 6px 8px rgba(0, 0, 0, 0.4);
        }

        .mahjong-tile.selected {
            outline: 3px solid #fbbf24;
            outline-offset: 2px;
            background: linear-gradient(145deg, #fffbeb 0%, #fef3c7 100%);
        }

        .mahjong-tile.hinted {
            animation: pulseGlow 1.2s infinite alternate;
            outline: 3px solid #38bdf8;
            outline-offset: 2px;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 10px #38bdf8; }
            100% { transform: scale(1.06); box-shadow: 0 0 22px #0284c7; }
        }

        /* Ficha eliminada/desaparecida */
        .mahjong-tile.matched {
            opacity: 0;
            transform: scale(0.4) rotate(10deg);
            pointer-events: none;
            transition: all 0.3s ease-out;
        }

        /* Overlay canvas para el camino con resplandor */
        #pathCanvas {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
        }

        /* Scrollbar estética */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e130b;
        }
        ::-webkit-scrollbar-thumb {
            background: #78350f;
            border-radius: 4px;
        }
    </style>
