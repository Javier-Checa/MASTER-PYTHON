<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Personas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #8cb0e5;
    }
    h2, h3 {
      color: #181212;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(58, 49, 49, 0.33);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .full-width {
      grid-column: span 2;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, textarea {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      grid-column: span 2;
      padding: 10px;
      background-color: #017c13;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #383bdc;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #bbabab;
    }
  </style>
</head>
<body>

  <h2>Registro de Datos Personales</h2>

  <form id="personaForm">
    <div class="form-group">
      <label for="nombre">Nombre Completo:</label>
      <input type="text" id="nombre" required>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono">
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email">
    </div>

    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion">
    </div>

    <div class="form-group full-width">
      <label for="notas">Otros datos / Notas:</label>
      <textarea id="notas" rows="2"></textarea>
    </div>

    <button type="submit">Guardar Persona</button>
  </form>

  <h3>Lista de Personas Registradas</h3>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Email</th>
        <th>Dirección</th>
        <th>Otros / Notas</th>
      </tr>
    </thead>
    <tbody id="tablaCuerpo">
      <!-- Los datos cargados dinámicamente con JS aparecerán aquí -->
    </tbody>
  </table>

  <script>
    const API_URL = '/api/personas';

    // Cargar datos existentes al iniciar
    document.addEventListener('DOMContentLoaded', cargarPersonas);

    // Manejar el envío del formulario
    document.getElementById('personaForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevaPersona = {
        nombre: document.getElementById('nombre').value,
        telefono: document.getElementById('telefono').value,
        email: document.getElementById('email').value,
        direccion: document.getElementById('direccion').value,
        notas: document.getElementById('notas').value
      };

      try {
        const respuesta = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevaPersona)
        });

        if (respuesta.ok) {
          document.getElementById('personaForm').reset();
          cargarPersonas();
        } else {
          alert('Error al guardar los datos');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
      }
    });

    // Obtener y renderizar la lista en la tabla
    async function cargarPersonas() {
      try {
        const respuesta = await fetch(API_URL);
        const personas = await respuesta.json();

        const tbody = document.getElementById('tablaCuerpo');
        tbody.innerHTML = '';

        personas.forEach(p => {
          const fila = document.createElement('tr');
          fila.innerHTML = `
            <td>${p.nombre}</td>
            <td>${p.telefono}</td>
            <td>${p.email}</td>
            <td>${p.direccion}</td>
            <td>${p.notas}</td>
          `;
          tbody.appendChild(fila);
        });
      } catch (error) {
        console.error('Error al cargar datos:', error);
      }
    }
  </script>
</body>
</html>
